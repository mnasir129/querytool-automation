---

ansible_connection: winrm
ansible_port: 5986
ansible_winrm_scheme: https
ansible_winrm_transport: ntlm
ansible_winrm_server_cert_validation: ignore

ansible_user: "{{ lookup('env', 'QUERYTOOL_WINRM_USER') }}"
ansible_password: "{{ lookup('env', 'QUERYTOOL_WINRM_PASSWORD') }}"

edex_target_environment: "PreProd"
edex_backup_base_location: "D:\\QueryToolBackup\\{{ '%Y%m%d' | ansible.builtin.strftime }}"
