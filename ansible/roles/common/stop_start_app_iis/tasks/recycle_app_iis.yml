---

- name: "Recycle apppool for {{ iis_application_name | mandatory }}"
  ansible.windows.win_shell: >
    C:\Windows\System32\inetsrv\appcmd
    recycle apppool
    /apppool.name:{{ iis_application_pool_name | mandatory }}
  become: true
  become_method: runas
  become_user: "{{ ansible_facts['user_id'] }}"

- name: Run readiness probe after recycling app pool
  ansible.builtin.include_role:
    name: common/healthcheck_app_iis
