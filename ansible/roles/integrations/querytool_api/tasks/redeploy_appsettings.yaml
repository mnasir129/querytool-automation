---

- name: Redeploy QueryTool API appsettings
  ansible.builtin.include_role:
    name: common/redeploy_appsettings_iis
  vars:
    iis_application_directory: "{{ querytool_api_deployment_path }}"

    iis_application_name: "{{ querytool_api_application_name }}"

    iis_application_pool_name: "{{ querytool_api_application_pool_name }}"

    iis_application_settings_file: "{{ querytool_api_application_settings_file }}"

    iis_application_healthcheck_url: "{{ querytool_api_application_healthcheck_url }}"
